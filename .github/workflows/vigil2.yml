# Vigil 2 (vigil2/): format, lint, test, supply chain. Vigil 1's checks are unchanged.
name: vigil2
on:
  push:
    paths: ["vigil2/**", ".github/workflows/vigil2.yml", "vigil/core/**", "tests/fixtures/**"]
  pull_request:
    paths: ["vigil2/**", ".github/workflows/vigil2.yml", "vigil/core/**", "tests/fixtures/**"]
permissions:
  contents: read
defaults:
  run:
    working-directory: vigil2
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - name: System libraries (app, D-Bus tests)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libfontconfig-dev dbus
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Golden files are current (Vigil 1 and 2 agree on the same inputs)
        run: |
          python3 tests/golden/make_golden.py
          git diff --exit-code -- tests/golden
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { manifest-path: vigil2/Cargo.toml, command: check licenses advisories bans sources }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit && cargo audit
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream libxml2-utils systemd
      - run: cargo run -p xtask -- check-packaging
# Not yet: eBPF tests in a VM (virtme-ng) arrive with the sensor (milestone 3);
# signed release artefacts, SBOM and the AUR / COPR / OBS jobs arrive with the first release.
