<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil Tasks</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/tasks.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <polygon points="16,4 26.4,10 16,16 5.6,10" fill="#9fe3df"/>
      <polygon points="5.6,10 16,16 16,28 5.6,22" fill="#3f9a95"/>
      <polygon points="26.4,10 16,16 16,28 26.4,22" fill="#5dbdb9"/>
      <circle cx="16" cy="16" r="2.2" fill="#ff9f43"/>
    </svg>
    Vigil <span class="tool-name">Tasks</span> <small>what is running</small>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="tree" class="active">Process tree</button>
    <button type="button" data-tab="flagged">Flagged<span class="count" id="flag-count" hidden></span></button>
  </nav>
  <div class="status" id="status"></div>
</header>
<main>
  <section class="tab active" id="tab-tree">
    <div class="split">
      <div class="main">
        <div class="form-row">
          <input type="search" id="filter" placeholder="Filter by name, user, package or path" autocomplete="off">
          <label class="field"><input type="checkbox" id="kernel"> kernel threads</label>
          <label class="field"><input type="checkbox" id="live" checked> refresh every 5 s</label>
          <button type="button" class="btn" id="save" title="Save the current flags for Vigil Cases">Save findings</button>
        </div>
        <p class="faint" id="note"></p>
        <div id="tree"></div>
      </div>
      <aside class="side" id="detail"><p class="muted">Pick a process to see where it came from.</p></aside>
    </div>
  </section>
  <section class="tab" id="tab-flagged">
    <div class="split"><div class="main"><div id="flagged"></div></div></div>
  </section>
</main>
</body>
</html>
