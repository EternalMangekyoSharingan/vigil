<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Who may own and call Vigil's daemon on the system bus.
     Anyone may send it messages: the daemon checks every caller itself
     (uid from the bus, then polkit for anything beyond reading). -->
<busconfig>
  <policy user="vigil">
    <allow own="org.vigil.Daemon"/>
  </policy>
  <policy user="root">
    <allow own="org.vigil.Daemon"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.vigil.Daemon"/>
    <allow receive_sender="org.vigil.Daemon"/>
  </policy>
</busconfig>
