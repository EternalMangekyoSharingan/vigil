# cargo deny: licences, advisories, duplicate versions and sources.
# docs/RUST_REWRITE.md section 9: every crate is a decision. The list of *direct*
# dependencies is enforced by xtask (check-deps); this file guards the whole tree.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Accepted, each for a stated reason, and only while it holds. Re-check at every GPUI update.
# None of these crates is in vigild's tree (`cargo tree -p vigild -i <crate>` says so).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained, no known flaw): build-time macro inside GPUI; app only" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz (unmaintained): GPUI's text shaping; app only, shapes our own strings" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained): GPUI's font parsing of installed system fonts; app only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 (merged into zbus 6): only via GPUI's AccessKit/portal crates; vigild uses zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 (merged into zbus 6): only via GPUI's AccessKit/portal crates; vigild uses zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 (merged into zbus 6): only via GPUI; vigild uses zbus 6" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0", "Unlicense", "NCSA"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path; nothing here is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
