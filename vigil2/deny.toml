# cargo deny: licences, advisories, duplicate versions and sources.
# docs/RUST_REWRITE.md section 9: every crate is a decision. The list of *direct*
# dependencies is enforced by xtask (check-deps); this file guards the whole tree.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
